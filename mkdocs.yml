---
site_name: thelab-typing
site_description: A collection of utilities related to Python type checking
site_url: https://thelabnyc.gitlab.io/thelab-typing/

theme:
  name: material
  variant: classic
  custom_dir: docs-theme-overrides
  font: false
  icon:
    repo: fontawesome/brands/git-alt
  features:
    - navigation.indexes
    - navigation.tabs
    - search.suggest
    - search.highlight

repo_name: thelab-typing
repo_url: https://gitlab.com/thelabnyc/thelab-typing
edit_uri: -/edit/master/docs/

docs_dir: docs/
site_dir: build/mkdocs/

extra_css:
  - vendor/@fontsource-variable/roboto/index.css
  - vendor/@fontsource-variable/roboto/wght-italic.css
  - vendor/@fontsource-variable/roboto-mono/index.css
  - vendor/@fontsource-variable/roboto-mono/wght-italic.css
  - styles.css

markdown_extensions:
  - toc:
      permalink: true
  - abbr
  - def_list
  - footnotes
  - md_in_html
  - codehilite
  - smarty
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - mkautodoc

use_directory_urls: false

extra:
  # GitLab Pages can't send response headers, so this goes in a <meta> tag.
  content_security_policy: >-
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    connect-src 'self' https://gitlab.com/api/v4/projects/;
    object-src 'none';
    base-uri 'self';
    form-action 'self'

plugins:
  - search

nav:
  - Home: index.md
  - Guides:
    - guides/index.md
    - Result Types: guides/result-types.md
    - Type Guards: guides/type-guards.md
    - Django Integration: guides/django-integration.md
    - DRF Integration: guides/drf-integration.md
