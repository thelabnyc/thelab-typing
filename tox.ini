[tox]
isolated_build = True
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist = py{313,314}-django{520,600}

[testenv]
passenv = *
allowlist_externals =
    bash
deps =
    django520: django>=5.2,<5.3
    django520: django-stubs>=5.2,<5.3
    django520: django-stubs-ext>=5.2,<5.3
    django600: django>=6.0,<6.1
    django600: django-stubs>=6.0,<6.1
    django600: django-stubs-ext>=6.0,<6.1
setenv =
    PYTHONWARNINGS = d
extras =
    django
    drf
# Install the dependencies managed by Poetry, except for Django and django-stubs
# (which were already installed by tox with version-matched pins). This prevents
# uv from overwriting the versions we're trying to test with.
commands_pre =
    bash -c 'uv export --all-extras --no-hashes --no-emit-project | \
        grep -v "^[dD]jango==" | \
        grep -v "^django-stubs" | \
        pip install --no-deps -r /dev/stdin'
commands =
    mypy {toxinidir}/thelabtyping/
    {envpython} -m coverage run \
        manage.py test \
        --noinput \
        -v 2 \
        --buffer \
        thelabtyping
    coverage report -i -m
    coverage xml
